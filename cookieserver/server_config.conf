[server]
; Bind address for the WebSocket server
host = 0.0.0.0

; Port to listen on
port = 52314

; WebSocket protocol-level ping interval (seconds): server sends ping frames,
; used to detect dead connections and keep idle sockets alive through NAT.
; Independent from the extension's keepalive (chrome.alarms).
ping_interval = 30

; Timeout to wait for a client's pong before dropping the connection (seconds)
ping_timeout = 10

; Maximum time to wait for one client while broadcasting an update (seconds)
; On send failure/timeout its transport is aborted without waiting for a close handshake.
broadcast_timeout = 5

; TLS certificate and key files (PEM). Defaults point to the generated
; self-signed cert.pem/key.pem in keys/. To use certs issued by a real CA
; (so browser clients trust wss:// without manual import), uncomment and
; point these at e.g. Let's Encrypt fullchain.pem / privkey.pem.
; cert = /etc/letsencrypt/live/example.com/fullchain.pem
; key = /etc/letsencrypt/live/example.com/privkey.pem

; Minimum interval between two different cookie pairs for one account (seconds).
; During this interval every attempted change is rejected in favor of the
; stored pair. Identical pairs do not restart the interval.
; Explicit refresh after reauthentication bypasses this interval only when
; expected_revision matches the current account revision.
cookie_update_interval = 300

; Maximum size of an incoming message (bytes). Two browser cookies may occupy
; more than 8 KiB together with their metadata.
max_size = 16384

; File encoding for account storage
encoding = utf-8

; Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = info
